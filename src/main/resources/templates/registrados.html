<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments :: head (titulo='Usuarios Registrados')"></head>

<body>

<div th:replace="fragments :: navbar"></div>

<div class="container">
  <div class="row mt-3">
    <div class="col">
      <h2>Listado de usuarios registrados</h2>
    </div>
  </div>

  <div class="row mt-3">
    <div class="col">
      <table class="table table-striped">
        <thead>
        <tr>
          <th>Identificador</th>
          <th>Correo electrónico</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="u: ${usuarios}">
          <td th:text="${u.id}"></td>
          <td th:text="${u.email}"></td>
          <td>
            <span th:if="${u.bloqueado != null && u.bloqueado}" class="badge badge-danger">Bloqueado</span>
            <span th:unless="${u.bloqueado != null && u.bloqueado}" class="badge badge-success">Activo</span>
          </td>
          <td>
            <a class="btn btn-primary btn-sm" th:href="@{'/registrados/' + ${u.id}}">Ver detalles</a>

            <!-- Bloquear / Desbloquear (oculto para el propio admin logeado) -->
            <span th:if="${u.id != usuario.id}">
                            <form th:if="${u.bloqueado == null || !u.bloqueado}"
                                  th:action="@{'/registrados/' + ${u.id} + '/bloquear'}" method="post" style="display:inline;">
                                <button type="submit" class="btn btn-warning btn-sm">Bloquear</button>
                            </form>
                            <form th:if="${u.bloqueado != null && u.bloqueado}"
                                  th:action="@{'/registrados/' + ${u.id} + '/desbloquear'}" method="post" style="display:inline;">
                                <button type="submit" class="btn btn-success btn-sm">Habilitar</button>
                            </form>
                        </span>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div th:replace="fragments::javascript"/>

</body>
</html>
