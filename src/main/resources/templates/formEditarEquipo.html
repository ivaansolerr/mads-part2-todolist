<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: head (titulo='Editar equipo')"></head>
<body>
<div th:replace="fragments :: navbar"></div>
<div class="container-fluid">
    <div class="row mt-3">
        <div class="col-md-6">
            <h2>Editar equipo</h2>
            <form method="post" th:action="@{/equipos/{id}/editar(id=${equipo.id})}">
                <div class="form-group mb-3">
                    <label for="nombre">Nombre del equipo:</label>
                    <input type="text" class="form-control" id="nombre" name="nombre" th:value="${equipo.nombre}" required/>
                </div>
                <button type="submit" class="btn btn-primary">Guardar</button>
                <a class="btn btn-secondary" th:href="@{/equipos}">Cancelar</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
