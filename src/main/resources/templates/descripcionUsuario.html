<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments :: head (titulo='Descripción de Usuario')"></head>

<body>

<div th:replace="fragments :: navbar"></div>

<div class="container">
    <div class="row mt-3">
        <div class="col">
            <h2>Detalles del usuario</h2>
            <ul class="list-group mt-3">
                <li class="list-group-item"><strong>ID:</strong> <span th:text="${usuarioConsultado.id}"></span></li>
                <li class="list-group-item"><strong>Nombre:</strong> <span th:text="${usuarioConsultado.nombre}"></span></li>
                <li class="list-group-item"><strong>Email:</strong> <span th:text="${usuarioConsultado.email}"></span></li>
                <li class="list-group-item"><strong>Fecha de nacimiento:</strong>
                    <span th:text="${usuarioConsultado.fechaNacimiento != null ? #dates.format(usuarioConsultado.fechaNacimiento, 'dd/MM/yyyy') : 'No especificada'}"></span>
                </li>
            </ul>
            <p class="mt-3">
                <a class="btn btn-secondary" th:href="@{/registrados}">Volver a la lista</a>
            </p>
        </div>
    </div>
</div>

<div th:replace="fragments::javascript"/>

</body>
</html>
