<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: head (titulo='Detalle de Equipo')"></head>
<body>
<div th:replace="fragments :: navbar"></div>
<div class="container-fluid">
    <div class="row mt-3">
        <div class="col">
            <h2 th:text="'Equipo: ' + ${equipo.nombre}">Nombre del equipo</h2>
        </div>
    </div>
    <div class="row mt-3">
        <div class="col-md-8">
            <h4>Miembros</h4>
            <table class="table table-striped" th:if="${not #lists.isEmpty(usuarios)}">
                <thead>
                <tr>
                    <th>Email</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="usuario : ${usuarios}">
                    <td th:text="${usuario.email}">email@ua</td>
                    <td>
                        <button type="button" class="btn btn-danger btn-sm"
                                th:onclick="'eliminarMiembro(' + ${equipo.id} + ',' + ${usuario.id} + ')'">
                            Eliminar
                        </button>
                    </td>
                </tr>
                </tbody>
            </table>
            <p th:if="${#lists.isEmpty(usuarios)}">Este equipo no tiene miembros actualmente.</p>
            <a class="btn btn-secondary mt-2" th:href="@{/equipos}">Volver al listado</a>
        </div>
    </div>
</div>

<script type="text/javascript">
    function eliminarMiembro(idEquipo, idUsuario) {
        if (confirm('¿Desea eliminar a este usuario del equipo?')) {
            fetch('/equipos/' + idEquipo + '/usuarios/' + idUsuario, {
                method: 'DELETE'
            }).then(response => {
                if (response.ok || response.redirected) {
                    window.location.reload();
                }
            });
        }
    }
</script>
</body>
</html>
