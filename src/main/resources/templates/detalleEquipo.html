<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: head (titulo='Detalle de Equipo')"></head>
<body>
<div th:replace="fragments :: navbar"></div>
<div class="container-fluid">
    <div class="row mt-3">
        <div class="col">
            <h2 th:text="'Equipo: ' + ${equipo.nombre}">Nombre del equipo</h2>
        </div>
    </div>
    <div class="row mt-3">
        <div class="col-md-8">
            <h4>Miembros</h4>
            <table class="table table-striped" th:if="${not #lists.isEmpty(usuarios)}">
                <thead>
                <tr>
                    <th>Email</th>
                    <!-- Solo mostramos cabecera de acciones si es admin o si el usuario logueado es miembro -->
                    <th th:if="${esAdmin or esMiembro}">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="usuarioMiembro : ${usuarios}">
                    <td th:text="${usuarioMiembro.email}">email@ua</td>
                    <td th:if="${esAdmin or esMiembro}">
                        <!-- Caso 1: Es el propio usuario conectado -> botón 'Salir' -->
                        <button type="button" class="btn btn-danger btn-sm"
                                th:if="${idUsuarioLogeado != null and idUsuarioLogeado == usuarioMiembro.id}"
                                th:onclick="'eliminarMiembro(' + ${equipo.id} + ',' + ${usuarioMiembro.id} + ')'">
                            Salir
                        </button>

                        <!-- Caso 2: Es administrador y no es él mismo -> botón 'Eliminar' -->
                        <button type="button" class="btn btn-danger btn-sm"
                                th:if="${esAdmin and (idUsuarioLogeado == null or idUsuarioLogeado != usuarioMiembro.id)}"
                                th:onclick="'eliminarMiembro(' + ${equipo.id} + ',' + ${usuarioMiembro.id} + ')'">
                            Eliminar
                        </button>
                    </td>
                </tr>
                </tbody>
            </table>
            <p th:if="${#lists.isEmpty(usuarios)}">Este equipo no tiene miembros actualmente.</p>

            <div class="mt-3">
                <!-- Botón para unirse si está autenticado y aún no pertenece al equipo -->
                <form th:if="${!esMiembro and idUsuarioLogeado != null}"
                      th:action="@{/equipos/{idEquipo}/usuarios/{idUsuario}(idEquipo=${equipo.id}, idUsuario=${idUsuarioLogeado})}"
                      method="post" style="display: inline;">
                    <button type="submit" class="btn btn-success">Unirme al equipo</button>
                </form>

                <a class="btn btn-secondary" th:href="@{/equipos}">Volver al listado</a>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    function eliminarMiembro(idEquipo, idUsuario) {
        if (confirm('¿Seguro que deseas eliminar a este usuario del equipo?')) {
            fetch('/equipos/' + idEquipo + '/usuarios/' + idUsuario, {
                method: 'DELETE'
            }).then(response => {
                if (response.ok || response.redirected) {
                    window.location.reload();
                }
            });
        }
    }
</script>

<div th:replace="fragments :: javascript"></div>
</body>
