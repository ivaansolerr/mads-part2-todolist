<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: head (titulo='Detalle de Equipo')"></head>
<body>
<div th:replace="fragments :: navbar"></div>
<div class="container-fluid">
    <div class="row mt-3">
        <div class="col">
            <h2 th:if="${equipo != null}" th:text="'Equipo: ' + ${equipo.nombre}">Nombre del equipo</h2>
        </div>
    </div>
    <div class="row mt-3">
        <div class="col-md-8">
            <h4>Miembros</h4>
            <table class="table table-striped" th:if="${usuarios != null and not #lists.isEmpty(usuarios)}">
                <thead>
                <tr>
                    <th>Email</th>
                    <th th:if="${esAdmin or esMiembro}">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="usuarioMiembro : ${usuarios}">
                    <td th:text="${usuarioMiembro != null ? usuarioMiembro.email : ''}">email@ua</td>
                    <td th:if="${esAdmin or esMiembro}">
                        <!-- Si es el propio usuario logueado -> botón Salir -->
                        <form th:if="${idUsuarioLogeado != null and usuarioMiembro != null and idUsuarioLogeado == usuarioMiembro.id}"
                              th:action="@{/equipos/{idEquipo}/usuarios/{idUsuario}/eliminar(idEquipo=${equipo.id}, idUsuario=${usuarioMiembro.id})}"
                              method="post" style="display:inline;">
                            <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('¿Seguro que deseas salir del equipo?');">
                                Salir
                            </button>
                        </form>

                        <!-- Si es admin y no es él mismo -> botón Eliminar -->
                        <form th:if="${esAdmin and (idUsuarioLogeado == null or (usuarioMiembro != null and idUsuarioLogeado != usuarioMiembro.id))}"
                              th:action="@{/equipos/{idEquipo}/usuarios/{idUsuario}/eliminar(idEquipo=${equipo.id}, idUsuario=${usuarioMiembro.id})}"
                              method="post" style="display:inline;">
                            <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('¿Seguro que deseas eliminar a este miembro?');">
                                Eliminar
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
            <p th:if="${usuarios == null or #lists.isEmpty(usuarios)}">Este equipo no tiene miembros actualmente.</p>

            <div class="mt-3">
                <form th:if="${!esMiembro and idUsuarioLogeado != null and equipo != null}"
                      th:action="@{/equipos/{idEquipo}/usuarios/{idUsuario}(idEquipo=${equipo.id}, idUsuario=${idUsuarioLogeado})}"
                      method="post" style="display: inline;">
                    <button type="submit" class="btn btn-success">Unirme al equipo</button>
                </form>

                <a class="btn btn-secondary" th:href="@{/equipos}">Volver al listado</a>
            </div>
        </div>
    </div>
</div>

<div th:replace="fragments :: javascript"></div>
</body>
</html>
