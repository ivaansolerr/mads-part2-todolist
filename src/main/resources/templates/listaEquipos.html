<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: head (titulo='Listado de Equipos')"></head>
<body>
<div th:replace="fragments :: navbar"></div>
<div class="container-fluid">
    <div class="row mt-3">
        <div class="col">
            <h2>Equipos</h2>
            <p>
                <a class="btn btn-success" th:href="@{/equipos/nuevo}">Crear nuevo equipo</a>
            </p>
            <table class="table table-striped">
                <thead>
                <tr>
                    <th>Nombre</th>
                    <th th:if="${esAdmin}">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="equipo : ${equipos}">
                    <td>
                        <a th:href="@{/equipos/{id}(id=${equipo.id})}" th:text="${equipo.nombre}">Nombre</a>
                    </td>
                    <td th:if="${esAdmin}">
                        <a class="btn btn-primary btn-sm" th:href="@{/equipos/{id}/editar(id=${equipo.id})}">Editar</a>
                        <button type="button" class="btn btn-danger btn-sm"
                                th:onclick="'eliminarEquipo(' + ${equipo.id} + ')'">
                            Eliminar
                        </button>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script type="text/javascript">
    function eliminarEquipo(idEquipo) {
        if (confirm('¿Desea eliminar este equipo?')) {
            fetch('/equipos/' + idEquipo, {
                method: 'DELETE'
            }).then(response => {
                if (response.ok || response.redirected) {
                    window.location.reload();
                }
            });
        }
    }
</script>

<div th:replace="fragments :: javascript"></div>
</body>
</html>
