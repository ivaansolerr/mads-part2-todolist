<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: head (titulo='Listado de Equipos')"></head>
<body>
<div th:replace="fragments :: navbar"></div>
<div class="container-fluid">
    <div class="row mt-3">
        <div class="col">
            <h2>Equipos</h2>
            <p>
                <a class="btn btn-success" th:href="@{/equipos/nuevo}">Crear nuevo equipo</a>
            </p>
            <table class="table table-striped">
                <thead>
                <tr>
                    <th>Nombre</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="equipo : ${equipos}">
                    <td>
                        <a th:href="@{/equipos/{id}(id=${equipo.id})}" th:text="${equipo.nombre}">Nombre</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
